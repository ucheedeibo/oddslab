<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OddsLab</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }
    body {
      margin: 0;
      padding: 0 0 70px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }
    .header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .header span {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    .container {
      padding: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }
    .btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #000;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .nav-btn.active {
      color: var(--accent-color);
    }
    .nav-btn span {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>OddsLab</h1>
    <span>THINK BEYOND THE SCORE.</span>
  </div>

  <div class="container" id="main-content">
    <div class="card">
      <label style="display:block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-sub);">Match Date</label>
      <input type="date" id="match-date" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 12px;">
      <button class="btn" onclick="buildSlips()">⚡ Build Today's Slips (~3.00)</button>
      <button class="btn btn-secondary" onclick="loadPerformanceStats(30)">📊 View 30-Day Performance</button>
    </div>

    <div id="slips-container"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="home">
      <span>🏠</span><span>Home</span>
    </button>
    <button class="nav-btn" data-tab="slips" onclick="loadPerformanceStats(30)">
      <span>🎫</span><span>Slips</span>
    </button>
    <button class="nav-btn" data-tab="live">
      <span>🔴</span><span>Live</span>
    </button>
    <button class="nav-btn" data-tab="fixtures">
      <span>📅</span><span>Fixtures</span>
    </button>
    <button class="nav-btn" data-tab="account" onclick="loadPerformanceStats(30)">
      <span>👤</span><span>Account</span>
    </button>
  </nav>

  <script src="/static/app.js?v=4"></script>
  <script>
    async function loadPerformanceStats(days = 30) {
      try {
        const res = await fetch(`/oa/performance?days=${days}`, {
          headers: { 'X-Requested-With': 'oddslab' }
        });
        if (!res.ok) throw new Error('Failed to fetch performance stats');
        const data = await res.json();
        console.log("Performance Data:", data);
        alert(`Last ${days} Days Performance:\n\n` +
              `Total Slips: ${data.total_slips}\n` +
              `Win Rate: ${data.win_rate_percent}%\n` +
              `ROI: ${data.roi_percent}%\n` +
              `Net Profit: ${data.net_profit}`);
      } catch (err) {
        console.error(err);
        alert("Could not load performance stats. Please make sure you are logged in.");
      }
    }
  </script>
</body>
</html>
