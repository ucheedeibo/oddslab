<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OddsLab</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #00E676;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }
    body {
      margin: 0;
      padding: 0 0 70px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }
    .header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .header span {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    .container {
      padding: 16px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }
    .btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #000;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .nav-btn.active {
      color: var(--accent-color);
    }
    .nav-btn span {
      font-size: 1.2rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>OddsLab</h1>
    <span>THINK BEYOND THE SCORE.</span>
  </div>

  <div class="container">
    <!-- HOME / BUILD TAB -->
    <div id="tab-home" class="tab-content">
      <div class="card">
        <label style="display:block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-sub);">Match Date</label>
        <input type="date" id="day" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 12px;">
        
        <button class="btn" id="slips">⚡ Build Today's Slips (~3.00)</button>
        <button class="btn btn-secondary" id="load">📋 List All Fixtures</button>
        <button class="btn btn-secondary" id="perf-btn" style="border-color: var(--accent-color); color: var(--accent-color);">📊 View 30-Day Performance</button>
      </div>

      <div id="home-results"></div>
    </div>

    <!-- SLIPS TAB -->
    <div id="tab-slips" class="tab-content hidden">
      <div id="slips-container"></div>
    </div>

    <!-- LIVE TAB -->
    <div id="tab-live" class="tab-content hidden">
      <div class="card"><p style="color:#94a3b8; text-align:center; margin:0;">Tap the Live icon to load fixtures.</p></div>
    </div>

    <!-- FIXTURES TAB -->
    <div id="tab-fixtures" class="tab-content hidden">
      <div id="fixtures-container"></div>
    </div>

    <!-- ACCOUNT TAB -->
    <div id="tab-account" class="tab-content hidden">
      <div class="card">
        <div style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: #f8fafc;">👤 Account & API Settings</div>
        <label style="display:block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-sub);">APP_API_TOKEN</label>
        <input type="password" id="api-token-input" placeholder="Enter your token..." style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 12px;">
        <button class="btn" id="save-token-btn">💾 Save Token</button>
        <button class="btn btn-secondary" id="clear-token-btn" style="margin-top: 4px; color: #ef4444; border-color: #ef4444;">🗑️ Clear Saved Token</button>
        <p id="token-status-msg" style="font-size: 0.8rem; margin-top: 10px; text-align: center; color: var(--accent-color);"></p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="home"><span>🏠</span><span>Home</span></button>
    <button class="nav-btn" data-tab="slips"><span>🎫</span><span>Slips</span></button>
    <button class="nav-btn" data-tab="live"><span>🔴</span><span>Live</span></button>
    <button class="nav-btn" data-tab="fixtures"><span>📅</span><span>Fixtures</span></button>
    <button class="nav-btn" data-tab="account"><span>👤</span><span>Account</span></button>
  </nav>

  <script src="/static/app.js?v=14"></script>
  <script>
    document.getElementById('perf-btn')?.addEventListener('click', async () => {
      const homeResults = document.getElementById("home-results");
      if (homeResults) {
        homeResults.innerHTML = `<div class="card"><p style="color:#94a3b8; text-align:center; margin:0;">Loading performance analytics...</p></div>`;
      }

      try {
        let token = localStorage.getItem("app_api_token");
        const res = await fetch(`/oa/performance?days=30`, {
          headers: { 
            'x-requested-with': 'oddslab',
            'Authorization': `Bearer ${token || ""}`,
            'x-api-token': token || ""
          }
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error(`Server response: ${text.slice(0, 100)}`);
        }
        if (!res.ok) throw new Error(data.error || 'Failed to fetch performance stats');
        
        const profitColor = data.net_profit >= 0 ? '#00E676' : '#ef4444';
        const roiColor = data.roi_percent >= 0 ? '#00E676' : '#ef4444';

        const html = `
          <div class="card" style="border: 1px solid var(--accent-color);">
            <div style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: #f8fafc;">📊 30-Day Strategy Performance</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
              <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                <div style="font-size: 0.75rem; color: var(--text-sub);">Total Slips</div>
                <div style="font-size: 1.1rem; font-weight: 600; color: #fff;">${data.total_slips} (${data.won_slips} Won)</div>
              </div>
              <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                <div style="font-size: 0.75rem; color: var(--text-sub);">Win Rate</div>
                <div style="font-size: 1.1rem; font-weight: 600; color: #fff;">${data.win_rate_percent}%</div>
              </div>
              <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                <div style="font-size: 0.75rem; color: var(--text-sub);">Net Profit</div>
                <div style="font-size: 1.1rem; font-weight: 600; color: ${profitColor};">${data.net_profit > 0 ? '+' : ''}${data.net_profit}</div>
              </div>
              <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                <div style="font-size: 0.75rem; color: var(--text-sub);">ROI</div>
                <div style="font-size: 1.1rem; font-weight: 600; color: ${roiColor};">${data.roi_percent > 0 ? '+' : ''}${data.roi_percent}%</div>
              </div>
            </div>
          </div>
        `;
        if (homeResults) homeResults.innerHTML = html;
      } catch (err) {
        console.error(err);
        if (homeResults) {
          homeResults.innerHTML = `<div class="card"><p style="color: #ef4444; font-size: 0.85rem; margin:0;">Error loading performance: ${err.message}</p></div>`;
        }
      }
    });

    // Account Tab Logic
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const targetTab = btn.getAttribute('data-tab');

        if (targetTab === 'account') {
          const input = document.getElementById('api-token-input');
          const msg = document.getElementById('token-status-msg');
          const savedToken = localStorage.getItem('app_api_token');
          if (input) input.value = savedToken || '';
          if (msg) msg.textContent = savedToken ? '✅ Token saved locally.' : '⚠️ No token set.';
        }

        if (targetTab === 'live') {
          const liveContainer = document.getElementById('tab-live');
          if (!liveContainer) return;

          liveContainer.innerHTML = `<div class="card"><p style="color:#94a3b8; text-align:center; margin:0;">Fetching live fixtures...</p></div>`;

          try {
            let token = localStorage.getItem("app_api_token");
            const today = new Date().toISOString().split("T")[0];
            
            const res = await fetch(`/oa/fixtures?date=${today}`, {
              headers: { 
                'x-requested-with': 'oddslab',
                'Authorization': `Bearer ${token || ""}`,
                'x-api-token': token || ""
              }
            });
            
            const text = await res.text();
            let data;
            try {
              data = JSON.parse(text);
            } catch (e) {
              throw new Error(`Server response: ${text.slice(0, 100)}`);
            }

            if (!res.ok) throw new Error(data.error || `Server error: ${res.status}`);

            let html = '<div style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: #f8fafc;">🔴 Live Matches Today</div>';
            
            if (Array.isArray(data.fixtures) && data.fixtures.length > 0) {
              html += data.fixtures.map((f) => `
                <div class="card" style="margin-bottom: 10px; padding: 12px;">
                  <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">${f.league || 'League'}</div>
                  <div style="font-weight: 600; font-size: 0.95rem; color: #FFFFFF; display: flex; justify-content: space-between;">
                    <span>${f.home_team} vs ${f.away_team}</span>
                    <span style="color: #00E676; font-size: 0.85rem;">${f.status || 'Scheduled'}</span>
                  </div>
                </div>
              `).join('');
            } else {
              html += `<div class="card"><p style="color:#94a3b8; text-align:center; margin:0;">No fixtures scheduled for today.</p></div>`;
            }

            liveContainer.innerHTML = html;
          } catch (err) {
            console.error(err);
            liveContainer.innerHTML = `<div class="card"><p style="color: #ef4444; font-size: 0.85rem; margin:0;">Error loading live scores: ${err.message}</p></div>`;
          }
        }
      });
    });

    document.getElementById('save-token-btn')?.addEventListener('click', () => {
      const input = document.getElementById('api-token-input');
      const msg = document.getElementById('token-status-msg');
      if (input && input.value.trim()) {
        localStorage.setItem('app_api_token', input.value.trim());
        if (msg) {
          msg.style.color = '#00E676';
          msg.textContent = '✅ Token saved successfully!';
        }
      }
    });

    document.getElementById('clear-token-btn')?.addEventListener('click', () => {
      const input = document.getElementById('api-token-input');
      const msg = document.getElementById('token-status-msg');
      localStorage.removeItem('app_api_token');
      if (input) input.value = '';
      if (msg) {
        msg.style.color = '#ef4444';
        msg.textContent = '🗑️ Token cleared.';
      }
    });
  </script>
</body>
</html>
