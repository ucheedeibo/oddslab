  <script src="/static/app.js?v=17"></script>
  <script>
    document.getElementById('perf-btn')?.addEventListener('click', async () => {
      const homeResults = document.getElementById("home-results");
      if (homeResults) {
        homeResults.innerHTML = `<div class="card"><p style="color:#94a3b8; text-align:center; margin:0;">Loading performance analytics...</p></div>`;
      }

      try {
        let token = localStorage.getItem("app_api_token");
        const res = await fetch(`/oa/performance?days=30`, {
          headers: { 
            'x-requested-with': 'oddslab',
            'Authorization': `Bearer ${token || ""}`,
            'x-api-token': token || ""
          }
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error(`Server response: ${text.slice(0, 100)}`);
        }
        if (!res.ok) throw new Error(data.error || 'Failed to fetch performance stats');
        
        const profitColor = data.net_profit >= 0 ? '#00E676' : '#ef4444';
        const roiColor = data.roi_percent >= 0 ? '#00E676' : '#ef4444';

        const html = `
          <div class="card" style="border: 1px solid var(--accent-color);">
            <div style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: #f8fafc;">📊 30-Day Strategy Performance</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
              <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                <div style="font-size: 0.75rem; color: var(--text-sub);">Total Slips</div>
                <div style="font-size: 1.1rem; font-weight: 600; color: #fff;">${data.total_slips} (${data.won_slips} Won)</div>
              </div>
              <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                <div style="font-size: 0.75rem; color: var(--text-sub);">Win Rate</div>
                <div style="font-size: 1.1rem; font-weight: 600; color: #fff;">${data.win_rate_percent}%</div>
              </div>
              <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                <div style="font-size: 0.75rem; color: var(--text-sub);">Net Profit</div>
                <div style="font-size: 1.1rem; font-weight: 600; color: ${profitColor};">${data.net_profit > 0 ? '+' : ''}${data.net_profit}</div>
              </div>
              <div style="background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                <div style="font-size: 0.75rem; color: var(--text-sub);">ROI</div>
                <div style="font-size: 1.1rem; font-weight: 600; color: ${roiColor};">${data.roi_percent > 0 ? '+' : ''}${data.roi_percent}%</div>
              </div>
            </div>
          </div>
        `;
        if (homeResults) homeResults.innerHTML = html;
      } catch (err) {
        console.error(err);
        if (homeResults) {
          homeResults.innerHTML = `<div class="card"><p style="color: #ef4444; font-size: 0.85rem; margin:0;">Error loading performance: ${err.message}</p></div>`;
        }
      }
    });

    // Account & Live Tab Auto-Load Handlers
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const targetTab = btn.getAttribute('data-tab');

        if (targetTab === 'account') {
          const input = document.getElementById('api-token-input');
          const msg = document.getElementById('token-status-msg');
          const savedToken = localStorage.getItem('app_api_token');
          if (input) input.value = savedToken || '';
          if (msg) msg.textContent = savedToken ? '✅ Token saved locally.' : '⚠️ No token set.';
        }

        if (targetTab === 'live') {
          const liveContainer = document.getElementById('tab-live');
          if (!liveContainer) return;

          liveContainer.innerHTML = `<div class="card"><p style="color:#94a3b8; text-align:center; margin:0;">Fetching live scores...</p></div>`;

          try {
            let token = localStorage.getItem("app_api_token");
            const today = new Date().toISOString().split("T")[0];
            
            const res = await fetch(`/oa/fixtures?date=${today}`, {
              headers: { 
                'x-requested-with': 'oddslab',
                'Authorization': `Bearer ${token || ""}`,
                'x-api-token': token || ""
              }
            });
            
            const text = await res.text();
            let data;
            try {
              data = JSON.parse(text);
            } catch (e) {
              throw new Error(`Server response: ${text.slice(0, 100)}`);
            }

            if (!res.ok) throw new Error(data.error || `Server error: ${res.status}`);

            let html = '<div style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: #f8fafc;">🔴 Live Matches Today</div>';
            
            if (Array.isArray(data.fixtures) && data.fixtures.length > 0) {
              html += data.fixtures.map((f) => `
                <div class="card" style="margin-bottom: 10px; padding: 12px;">
                  <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">${f.league || 'League'}</div>
                  <div style="font-weight: 600; font-size: 0.95rem; color: #FFFFFF; display: flex; justify-content: space-between;">
                    <span>${f.home_team} vs ${f.away_team}</span>
                    <span style="color: #00E676; font-size: 0.85rem;">${f.status || 'Scheduled'}</span>
                  </div>
                </div>
              `).join('');
            } else {
              html += `
                <div class="card" style="text-align: center; padding: 20px 16px;">
                  <div style="font-size: 1.8rem; margin-bottom: 8px;">⚽</div>
                  <div style="font-size: 1rem; font-weight: 700; color: #f8fafc; margin-bottom: 6px;">No Live Fixtures Today</div>
                  <p style="font-size: 0.85rem; color: #94a3b8; margin: 0; line-height: 1.4;">
                    There are no matches scheduled or active for today's date. Check back later or pick another date from Home!
                  </p>
                </div>
              `;
            }

            liveContainer.innerHTML = html;
          } catch (err) {
            console.error(err);
            liveContainer.innerHTML = `<div class="card"><p style="color: #ef4444; font-size: 0.85rem; margin:0;">Error loading live scores: ${err.message}</p></div>`;
          }
        }
      });
    });

    document.getElementById('save-token-btn')?.addEventListener('click', () => {
      const input = document.getElementById('api-token-input');
      const msg = document.getElementById('token-status-msg');
      if (input && input.value.trim()) {
        localStorage.setItem('app_api_token', input.value.trim());
        if (msg) {
          msg.style.color = '#00E676';
          msg.textContent = '✅ Token saved successfully!';
        }
      }
    });

    document.getElementById('clear-token-btn')?.addEventListener('click', () => {
      const input = document.getElementById('api-token-input');
      const msg = document.getElementById('token-status-msg');
      localStorage.removeItem('app_api_token');
      if (input) input.value = '';
      if (msg) {
        msg.style.color = '#ef4444';
        msg.textContent = '🗑️ Token cleared.';
      }
    });
  </script>
